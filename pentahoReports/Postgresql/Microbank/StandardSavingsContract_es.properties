header.1.1=MONEY DEPOSIT AGREEMENT FOR OPERATIONS IN A SAVINGS ACCOUNT ENTERED INTO, ON THE ONE PART, BY ALEJANDRA REYES COLORADO, WHO SHALL HEREINAFTER BE DESIGNATED AS \u201cTHE MEMBER\u201d, AND ON THE OTHER PART \u201c
header.1.2=\u201d REPRESENTED IN THIS ACT BY LIC. ALEJANDRO ALDUC\u00cdN D\u00cdAZ, IN HIS CAPACITY AS LEGAL REPRESENTATIVE, WHO SHALL HEREINAFTER BE CALLED \u201cTHE INSTITUTION\u201d, IN ACCORDANCE WITH THE FOLLOWING:
title=\nCLAUSES
paragraph.1.1=\nFIRST. The purpose of this Money Deposit Agreement for demand operations in a savings account is to establish the guidelines pursuant to which
paragraph.1.2=shall offer the Member the demand deposit service. The Member may deposit, through the mechanisms set forth below, various amounts of money which, in accordance with the provisions of section I of Article 32 of the Popular Savings and Credit Law, shall be received by
paragraph.1.3=as savings Deposit. The Member may carry out, on business days and during business hours for
paragraph.1.4=, the operations listed below (hereinafter referred to as \u201cThe Services\u201d):
paragraph.2=\na-Make demand money Deposits.\nb-Make money withdrawals charged to his Balance or Available Balances.\nc-Request inquiries on his transactions or Available Balance at the branches and offices of the Institution.\nd-Request transfers to Investment Operations; and,\ne-Those additional services that the Institution establishes for the benefit of the Member.
paragraph.3=\nSECOND. The Member has access to The Services by virtue of the capital contribution that has been made to The Institution.
paragraph.4=\nTHIRD. All The Services carried out by the Member shall be performed only with his Member Number, which shall operate as a universal account, to which as many demand accounts may be assigned as the Member wishes to open (hereinafter referred to as \u201cMember Number\u201d).
paragraph.5=\nFOURTH. All access to The Services offered under this Agreement shall be made by express instructions of the Member, delivered at the offices of the Institution, by sending a fax, or through an email, or by telephone instructions, upon prior identification by the Institution, through his Number at the Institution and his account number.\n\nLikewise, with his Member Number, the Member may indicate, now or at any time, the account numbers at duly authorized Financial Intermediaries in accordance with applicable legal provisions (hereinafter \u201cThe Institution\u201d), to which Deposits from Available Balances of demand money may be made, leaving in all cases written evidence of this authorization.
paragraph.6=\nFIFTH. For purposes of this Agreement, Available Balance shall mean the sum of Deposits, plus the Interest accrued thereon, minus withdrawals, commissions, generated expenses, and withheld taxes accrued in each of the accounts (hereinafter \u201cAvailable Balances\u201d).
paragraph.7=\nSIXTH. The Member may authorize one or more persons so that, in his name and representation, as attorneys-in-fact, they may use The Services that are necessary in his account numbers under his Member Number (hereinafter \u201cAuthorized Persons\u201d).
paragraph.8=\nSEVENTH. The Member is responsible for the proper use of his Member Number and the account numbers provided by the Institution; therefore, any operations authorized under these credentials by the Member or by the Authorized Persons shall be the responsibility of the Member.
paragraph.9=\nEIGHTH. The Institution may freely determine the minimum amounts from which it is willing to receive and document demand money Deposits, and the amounts from which Interest shall accrue in favor of the Member.
paragraph.10=\nNINTH. Deposits made by the Member as defined in The Services must be made in National Currency, and the Institution shall return the sums lent in the same currency, in accordance with the Monetary Law in force in the United Mexican States at the time payment is made, returning an amount equal to that received, plus Interest generated, where applicable, minus commissions, expenses, tax withholdings, or other disbursements that may have been made. The Institution may make payments by cash, nominative check, or account Deposit at any Institution authorized by the Member in accordance with the agreements established in this Agreement.\n\nIf the Member wishes payments to be made through Deposit into an account drawn in favor of the Member at an Institution, the parties agree that such Deposit shall be made by the Institution into one of the accounts referred to in the Member's List of Banks and Account Numbers.
paragraph.11.1=\nTENTH. The Institution shall only receive on Deposit the amounts delivered on business days and during business hours at the offices of the Institution or through its branches, or when the Member deposits into checking accounts indicated by the Institution for such purpose, and of which the Institution is the holder. If the Member wishes to issue checks payable to the Institution, for Deposit into accounts in the name of the Member, such checks must be issued in the name of
paragraph.11.2=In no case shall the Institution be responsible for Deposits made by the Member or the Authorized Persons into an account where the Institution is not the holder.
paragraph.12=\nELEVENTH. The Institution shall credit to the accounts in the name of the Member the Deposits made by him on business days from Monday to Friday, from 9:00 hrs to 18:00 hrs, on the same date of Deposit. Deposits made after that time shall be deemed made on the following business day.
paragraph.13=\nTWELFTH. The amounts that the Member keeps deposited in his accounts shall generate Interest that shall be calculated by applying the current interest rate that the Institution determines for such purposes, and shall be credited to the Member's own account numbers in arrears on a monthly basis.
paragraph.14=\nTHIRTEENTH. Interest percentages shall be applied according to the range in which the Member's monthly average daily balance falls during the corresponding period. Interest shall be calculated by dividing the sum of the daily Available Balance of the corresponding month by the number of days in such month; that value shall be multiplied by the result of dividing the agreed annual interest rate by 360, and finally that value shall be multiplied by the number of days in the corresponding month.
paragraph.15=\nFOURTEENTH. The amount of Interest, the rate, and the corresponding balances shall be disclosed in the printed document evidencing the transaction, or in the corresponding account statement, where they may be reviewed by the Member. The Institution reserves the right to review and adjust the interest rate and the ranges for average daily balances. The interest rate that the Institution discloses for operations of the same class shall be made known through the website that the Institution has available on the Internet, on posters, boards, or visible notice boards prominently displayed in places open to the public in the offices of the Institution.
paragraph.16=\nFIFTEENTH. Interest shall accrue from the day on which the Member's Deposits are credited to his Account and until the day prior to that on which withdrawals are made. Interest shall be calculated monthly in accordance with the provisions of the preceding clauses and shall become part of the Available Balance of each account on the first business day of the month following the month in which it is calculated.
paragraph.17=\nSIXTEENTH. For the withdrawal and delivery of the Available Balance, the parties agree that the requested withdrawal shall be made by delivery of cash, solely and exclusively in the case of amounts less than a sum equivalent to 200 (Two Hundred) general daily minimum wages in force for the Federal District, in one or several transactions on the same day; or by nominative check in favor of the Member, any of the Authorized Persons, or a third party; or, where applicable, by Deposit of the funds into a bank account in the name of the Member, any of the Authorized Persons, or a third party.\n\nIf the nominative check is issued, or the Deposit of funds is transferred in favor of any of the Authorized Persons or a Third Party, the Member or, where applicable, any of the Authorized Persons must request such process in writing from the Institution, indicating the full name of the beneficiary and, where applicable, the account number, branch number, and name of the Institution where the funds will be deposited; consequently, if the Member or the Authorized Persons do not request the aforementioned process in writing, it shall be understood that the nominative check will be issued in the name of the Member, or the Deposit of funds will be made into the first account number indicated by the Member.\n\nIn accordance with what is agreed in this Agreement, full evidentiary effect for the delivery of the deposited funds shall be given to the Deposit slip or electronic transfer of such funds from the Institution's accounts to the Member's accounts or to the accounts that the Member or any of the Authorized Persons request in writing to deposit into an account in the name of the Authorized Persons or of a third party at any Institution, or, where applicable, the signature of the Member or any of the Authorized Persons or of a third party acknowledging receipt of the money or the respective nominative check evidencing delivery of the requested funds. The INSTITUTION reserves the right to refuse the requested withdrawal if there is insufficient Available Balance in the Member's account.
paragraph.18=\nSEVENTEENTH. Under the terms of applicable legal provisions, the Institution shall deduct, withhold, and remit from the gross interest rate the tax corresponding to the Member for operations carried out under this Agreement; therefore, it shall invariably deliver net returns to the Member. Likewise, the Institution shall transfer or pass on to the Member any contribution accrued under the terms of the applicable legislation.
paragraph.19=\nEIGHTEENTH. The Institution is authorized by the Member, by signing this Agreement, to charge his account for all expenses, commissions, tax withholdings, or any debt generated and chargeable to the Member in relation to this Agreement. Charges shall take effect from the date on which such expense, commission, withholding, or debt is generated.
paragraph.20=\nNINETEENTH. In the event that the request for disposition of funds in the Member's account numbers, requested by the Member or by any of the Authorized Persons, is not fulfilled by the Institution, the Institution shall not be liable when such non-fulfillment is due to fortuitous event, force majeure, or events such as failures in the operation of the computer systems of the Institution where the Member or any of the Authorized Persons wish the funds to be deposited, or by virtue of any interruption in communication systems with such Institution, or due to any similar event that the Institution is unable to resolve or that is beyond its control.
paragraph.21=\nTWENTIETH. The percentages for Interest payment, commissions, or the amount of charges to be made for any concept may be modified in accordance with provisions issued by the Ministry of Finance and Public Credit, the National Banking and Securities Commission, or the Bank of Mexico, or according to the internal policies of the Institution, and may be made automatically in the account numbers that the Institution opens in the name of the Member.
paragraph.22=\nTWENTY-FIRST.- The Member appoints as beneficiaries of the accounts protected by his Member Number the persons mentioned with such character in the Beneficiaries List. However, the Member may at any time designate or replace beneficiaries, or modify the proportion corresponding to those designated, by written notice addressed to the Institution.\n\nIn the event of the death of the Member, the Institution shall deliver to the beneficiaries the amount that the Member has expressly designated in writing for each of them, if there is an Available Balance.
paragraph.23.1=\nTWENTY-SECOND.- Authorized Persons and Account Management.- The Member may authorize a Co-Holder so that, in his name and on his behalf, such Co-Holder may make withdrawals of Deposits or products or services contracted under this Instrument and/or the corresponding Agreement, for which it shall be sufficient to grant such authorization in physical or electronic formats or in the signature registration card where the authorized person records his signature, which shall form an integral part of this Agreement. For the purposes of this Agreement, account management is understood as: I. Individual, in which the holder is the only person entitled to dispose of the account; II. Joint and Several, in which two or more natural persons are holders of the same account, all of whom are subject to the obligations and enjoy the rights derived from this Agreement, and each holder may independently issue orders and instructions to carry out operations, as well as make total or partial withdrawals from said account; or III. Joint, when for account management purposes, the concurrence of two or more holders is required for the corresponding dispositions. In all cases, the Member releases from all liability
paragraph.23.2=for the Instructions given or sent by one or more Authorized Persons authorized by the Member. The detail of Co-Holder members is contained in ANNEX: Co-Holders.
paragraph.24=\nTWENTY-THIRD. Money deliveries made to The Institution by means of documents shall be received \u201csubject to collection\u201d and their amount shall be definitively credited only upon collection, even when the documents appear as received by The Institution on a date prior to definitive credit.
paragraph.25=\nTWENTY-FOURTH. The Institution shall send, only at the express written request of the Member, within the first 1 (One) calendar day of each month, an account statement specifying amounts credited or charged; the balance at the beginning of the period and at the closing date; gross and net returns obtained; and, where applicable, the amount of commissions chargeable to the Member during the previous period. The closing date for the account statement shall be the last day of each month. The Institution shall notify the Member in writing of the closing date, which may not vary without prior written notice communicated at least one month in advance.\n\nThe Institution shall be released from sending the account statement to the Member when there has been no movement during the respective period, when during the period the daily average Available Balance has been lower than the sum of 500 (five hundred) general daily minimum wages for the Federal District, or when the Member has not expressed his desire in writing to receive it. Likewise, The Institution shall be released from the obligation to send the account statement when it provides the Member with the information through other printed means.
paragraph.26=\nTWENTY-FIFTH. The Member undertakes to review the operations recorded in his account statement or in the printed document delivered by The Institution, and must make the observations he deems appropriate. Where applicable, in order to object in a timely manner, the Member must request from The Institution his monthly account statement or information on account movements through other printed means, within the 1 (One) calendar day following the closing date. It shall be presumed that the Member received such account statement or movement information through another printed means if he does not claim it in writing within such period. During the 15 (fifteen) calendar days from account closing or the 5 (five) business days following receipt thereof, the Member may state in writing the objections or observations he considers appropriate; once the term agreed herein has elapsed, the operations recorded in the account statement or other printed means shall be considered valid and correct, and shall constitute proof unless evidence to the contrary is provided in the corresponding proceeding.
paragraph.27=\nTWENTY-SIXTH. Except for cases provided by law, The Institution may not provide news or information on recorded movements, the status of the Member's account, or operations carried out under it, except solely to the Member, his legal representatives, or Authorized Persons.\n\nHowever, the Member expressly authorizes The Institution to conduct investigations at all times and to provide reports or information to supervisory bodies overseeing The Institution, or to Credit Information Companies authorized by the Ministry of Finance and Public Credit, regarding operations entered into between The Institution and the Member, who states that he knows the nature and scope of the information to be requested or provided.
paragraph.28=\nTWENTY-SEVENTH. This Agreement may be modified by The Institution, for which it shall suffice to notify the Member in writing at least 10 (ten) business days in advance, through the methods established in Clause Thirty-Third of this Agreement. Such modifications shall be understood as tacitly accepted by the Member when the Member or any of the Authorized Persons carry out any transaction, issue any instruction to The Institution, or use any of The Services in any of the Member's account numbers or in new account numbers they wish to open under the Member Number.
paragraph.29=\n\nTWENTY-EIGHTH. This Agreement may be terminated by either party, upon written notice to the other party, with 15 (fifteen) calendar days of prior notice. Notwithstanding the termination of this Agreement, it shall continue producing all its legal effects between the parties until the Member and the INSTITUTION have fulfilled each and every obligation undertaken under this Agreement.
paragraph.30=\nTWENTY-NINTH. In the event the Member decides to terminate this Agreement, he must instruct the INSTITUTION in writing regarding the manner of disposition of securities or cash existing in his favor and, in any event, he must previously settle all balances charged to him; therefore, The Institution may not be dispossessed of resources owned by the Member until such balances have been fully paid.
paragraph.31=\nTHIRTIETH. In the event that The Institution decides to terminate this Agreement, once the Member has paid the balances referred to in the preceding Clause, the Member is obliged to withdraw the total Available Balance in his favor within 15 (fifteen) business days following the date of the respective notice; otherwise, the INSTITUTION is empowered to reimburse such Available Balance by a check in the name of the Member, which shall no longer generate Interest as of such date.
paragraph.32=\nTHIRTY-FIRST. Breach by the Member of any terms of this Agreement shall entitle The Institution to immediate termination thereof, regardless of its right to demand payment of damages and losses arising from such breach, issuing at that moment a check in the name of the Member for the amount of the Available Balance in his accounts under his Member Number, accounts that shall no longer generate Interest as of such date.
paragraph.33=\nTHIRTY-SECOND. The parties agree that the annexes to this Deposit Agreement, its additions, and amendments form an integral part of its content, and their content is binding and mandatory for both parties.
paragraph.34=\nTHIRTY-THIRD. For all judicial and extrajudicial purposes, the Member designates as his address, KNOWN ADDRESS CALCAHUALCO SN, Colonia CALCAHUALCO, C.P. 94050, and the INSTITUTION designates as its address, AV. 3 PONIENTE 414 CENTRO HUATUSCO VER.\n\nUntil the parties notify each other in writing of a change of address, all notices, notifications, and proceedings made at the addresses stated herein shall be deemed valid and shall produce all corresponding legal effects.
paragraph.35=\nTHIRTY-FOURTH. The parties agree that The Institution may make any notification to the Member through the account statement, other printed means, publications posted in the offices of The Institution, or by any other means of dissemination, or through notification delivered to the Member at any branch of The Institution or at his address.
paragraph.36.1=\nTHIRTY-FIFTH. For the interpretation and fulfillment of this Agreement, the parties expressly submit to the authority of the laws and to the jurisdiction of the Federal District, regardless of any venue that may correspond to them by virtue of their present and future addresses. Having stated the foregoing, the parties sign this Agreement on date
paragraph.36.2=in Mexico City, Federal District.\n\nI acknowledge that I am aware of the clauses and their implications regarding risk, return, and term resulting from my investments, as well as the manner in which I have been classified in your records for purposes of my tax regime; likewise, I acknowledge that the transaction(s) carried out shall be with money derived from the normal development of my own activity(ies) and therefore do not originate from the performance of illicit activities, for which reason I fully acknowledge that I know and understand the provisions related to operations carried out with resources of illicit origin and their consequences.\n\n\n\n\n\n\n\n\n
